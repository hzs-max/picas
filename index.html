tory:[{english:`The alarm blares at 6:30 AM, piercing through my peaceful slumber like a fire alarm.`,chinese:`闹钟在早上6:30突然响起，像火警一样刺破了我宁静的睡眠。`},{english:`I reluctantly reach for my phone and hit the snooze button, desperately craving just nine more minutes of rest.`,chinese:`我不情愿地伸手去拿手机，按下贪睡键，拼命地想再多睡九分钟。`},{english:`After hitting snooze three times, I finally drag myself out of bed, feeling groggy and disoriented.`,chinese:`按了三次贪睡键之后，我终于把自己从床上拖起来，感到昏昏沉沉、方向不清。`},{english:`I stumble to the bathroom and splash cold water on my face, trying to shake off the drowsiness.`,chinese:`我踉踉跄跄地走到浴室，往脸上泼冷水，试图驱散睡意。`},{english:`Somehow, I manage to get ready on time, but I am definitely not a morning person.`,chinese:`不知怎么的，我居然准时收拾好了，但我绝对不是个早起的人。`}],vocabulary:[{id:`1-reluctantly`,word:`reluctantly`,ipa:`/rɪˈlʌktəntli/`,partOfSpeech:`adverb`,definition:`in an unwilling and hesitant way`,chinese:`不情愿地；勉强地`,example:`She reluctantly agreed to attend the meeting on Saturday.`,exampleChinese:`她不情愿地同意参加周六的会议。`},{id:`1-groggy`,word:`groggy`,ipa:`/ˈɡrɒɡi/`,partOfSpeech:`adjective`,definition:`weak and unable to think clearly, usually because of illness or lack of sleep`,chinese:`昏昏沉沉的；头晕目眩的`,example:`I felt groggy after only three hours of sleep.`,exampleChinese:`只睡了三个小时后，我感到昏昏沉沉的。`},{id:`1-drowsy`,word:`drowsy`,ipa:`/ˈdraʊzi/`,partOfSpeech:`adjective`,definition:`sleepy and lethargic`,chinese:`困倦的；昏昏欲睡的`,example:`The warm afternoon sun made me feel drowsy during the lecture.`,exampleChinese:`温暖的午后阳光让我在讲座中感到昏昏欲睡。`},{id:`1-slumber`,word:`slumber`,ipa:`/ˈslʌmbə/`,partOfSpeech:`noun`,definition:`sleep, especially deep sleep`,chinese:`睡眠；沉睡`,example:`Nothing could rouse her from her deep slumber.`,exampleChinese:`什么都无法把她从沉睡中唤醒。`},{id:`1-stumble`,word:`stumble`,ipa:`/ˈstʌmbəl/`,partOfSpeech:`verb`,definition:`to trip or nearly lose balance while walking`,chinese:`踉跄；绊脚`,example:`He stumbled into the kitchen, half-asleep.`,exampleChinese:`他半睡半醒地踉跄走进厨房。`},{id:`1-desperately`,word:`desperately`,ipa:`/ˈdespərətli/`,partOfSpeech:`adverb`,definition:`in a way that shows despair or extreme urgency`,chinese:`拼命地；绝望地`,example:`I desperately need a cup of coffee to wake up.`,exampleChinese:`我拼命需要一杯咖啡来提神。`}],expressions:[{id:`1-hit-snooze`,phrase:`hit the snooze button`,explanation:`to press the button on an alarm clock that stops the alarm for a short time`,chinese:`按下贪睡键`,example:`I always hit the snooze button at least three times before getting up.`,exampleChinese:`我起床前总是至少按三次贪睡键。`},{id:`1-drag-out`,phrase:`drag oneself out of bed`,explanation:`to force oneself to get out of bed with great difficulty`,chinese:`费劲地把自己从床上拖起来`,example:`On Mondays, I can barely drag myself out of bed before 8 AM.`,exampleChinese:`星期一的时候，我几乎没法在8点前把自己从床上拖起来。`},{id:`1-morning-person`,phrase:`not a morning person`,explanation:`someone who does not feel energetic or happy in the early morning`,chinese:`不是早起的人；不爱早起的人`,example:`Don't try to have a conversation with me before 9 AM — I'm not a morning person.`,exampleChinese:`早上9点前别跟我说话——我不是个早起的人。`},{id:`1-shake-off`,phrase:`shake off the drowsiness`,explanation:`to get rid of the feeling of sleepiness`,chinese:`驱散睡意`,example:`A cold shower helps me shake off the drowsiness in the morning.`,exampleChinese:`冲个冷水澡能帮我在早上驱散睡意。`}],speak:{question:`Describe a time when you had to wake up very early.`,prompts:[`When it was and why you had to wake up early`,`How you felt about waking up early`,`What you did after waking up`,`And explain whether you are a morning person or not`],modelAnswer:`I remember last summer I had to wake up at 4:30 AM to catch an early flight to Beijing for a job interview. It was absolutely brutal — I'd gone to bed around midnight because I was busy preparing, so I only had about four and a half hours of sleep. When the alarm went off, I could barely open my eyes. I fumbled for my phone, hit snooze once, then somehow summoned the willpower to drag myself out of bed. I stumbled to the bathroom, splashed cold water on my face, and chugged a cup of instant coffee that tasted like cardboard. Strangely enough, once I got to the airport and saw the sunrise through the terminal windows, I actually felt quite energised. The interview went well, by the way. I wouldn't say I'm a morning person at all — given the choice, I'd happily sleep until 10 AM every day — but I've learned that when there's something important to do, I can drag myself out of bed even at ungodly hours.`,modelAnswerChinese:`我记得去年夏天我不得不在凌晨4:30起床，赶早班机去北京参加一场工作面试。那真的太难受了——我因为忙着准备，大概午夜才上床，所以只睡了大约四个半小时。闹钟响的时候，我几乎睁不开眼睛。我摸索着找手机，按了一次贪睡，然后不知怎么的鼓起了意志力把自己从床上拖起来。我踉踉跄跄地走到浴室，往脸上泼冷水，然后灌了一杯尝起来像纸板一样的速溶咖啡。奇怪的是，当我到了机场，透过航站楼窗户看到日出时，我居然感到挺有精神的。顺便说一句，面试进行得很顺利。我完全不觉得自己是个早起的人——如果可以选择，我每天都乐意睡到上午10点——但我明白了，当有重要的事情要做时，即使在极早的时间我也能把自己从床上拽起来。`},quiz:[{id:`1-q1`,type:`multiple-choice`,question:`What does "reluctantly" mean?`,options:[`Happily and eagerly`,`Unwillingly and hesitantly`,`Quickly and efficiently`,`Loudly and angrily`],correctAnswer:`Unwillingly and hesitantly`,explanation:`"Reluctantly" means doing something in an unwilling or hesitant way. 例如：She reluctantly agreed. 她不情愿地同意了。`},{id:`1-q2`,type:`fill-in-blank`,question:`I always ______ the snooze button before getting up.`,correctAnswer:`hit`,explanation:`The idiom is "hit the snooze button" (按下贪睡键). "Hit" is the correct verb here.`},{id:`1-q3`,type:`multiple-choice`,question:`If someone feels "groggy", they most likely:`,options:[`just drank coffee`,`just woke up`,`just exercised`,`just finished a meal`],correctAnswer:`just woke up`,explanation:`"Groggy" means weak and unable to think clearly, often due to lack of sleep. 刚睡醒时最常见。`},{id:`1-q4`,type:`matching`,question:`"drag oneself out of bed" means:`,options:[`to exercise in bed`,`to force oneself to get up with difficulty`,`to drag the bed to another room`,`to sleep very late`],correctAnswer:`to force oneself to get up with difficulty`,explanation:`"Drag oneself out of bed" 表示费劲地把自己从床上拖起来，强调起床的困难。`},{id:`1-q5`,type:`fill-in-blank`,question:`A person who is NOT a ______ person finds it hard to wake up early.`,correctAnswer:`morning`,explanation:`"Not a morning person" is a common expression meaning someone who doesn't feel energetic in the morning. 不是个早起的人。`}]},{id:2,title:`Jam-Packed Subway`,subtitle:`The morning commute nightmare`,sceneKey:`subway`,accentColor:`#4ECDC4`,story:[{english:`The subway platform is absolutely packed during rush hour, with commuters jostling for position.`,chinese:`早高峰时地铁站台上挤得水泄不通，乘客们争相抢占位置。`},{english:`When the train arrives, people squeeze into every available inch of space, like sardines in a tin.`,chinese:`列车到站时，人们挤进每一寸可用的空间，就像罐头里的沙丁鱼。`},{english:`I manage to wedge myself in, but my face is practically pressed against the door.`,chinese:`我勉强挤了进去，但我的脸几乎贴在了车门上。`},{english:`The journey is uncomfortable, but I have no choice — it is the fastest way to get to work.`,chinese:`这段旅程很不舒服，但我别无选择——这是去上班最快的方式。`},{english:`By the time I arrive, I am exhausted and ready for another cup of coffee.`,chinese:`等我到达的时候，我已经筋疲力尽，准备再来一杯咖啡了。`}],vocabulary:[{id:`2-commute`,word:`commute`,ipa:`/kəˈmjuːt/`,partOfSpeech:`noun/verb`,definition:`the journey between home and work, or to make this journey`,chinese:`通勤；上下班往返`,example:`My daily commute takes about an hour each way.`,exampleChinese:`我每天的通勤单程大约需要一个小时。`},{id:`2-jostle`,word:`jostle`,ipa:`/ˈdʒɒsəl/`,partOfSpeech:`verb`,definition:`to push or bump against someone roughly, especially in a crowd`,chinese:`挤；推搡`,example:`People jostled each other to get on the bus.`,exampleChinese:`人们互相推挤着上公交车。`},{id:`2-wedge`,word:`wedge`,ipa:`/wedʒ/`,partOfSpeech:`verb`,definition:`to force something into a narrow space`,chinese:`挤入；楔入`,example:`She wedged herself between two passengers on the train.`,exampleChinese:`她在火车上挤在两个乘客之间。`},{id:`2-cram`,word:`cram`,ipa:`/kræm/`,partOfSpeech:`verb`,definition:`to fill something completely with people or things`,chinese:`塞满；挤满`,example:`The students crammed into the small lecture hall.`,exampleChinese:`学生们挤进了小小的报告厅。`},{id:`2-exhausted`,word:`exhausted`,ipa:`/ɪɡˈzɔːstɪd/`,partOfSpeech:`adjective`,definition:`extremely tired`,chinese:`筋疲力尽的`,example:`After the long hike, we were absolutely exhausted.`,exampleChinese:`长途徒步之后，我们完全筋疲力尽了。`},{id:`2-practically`,word:`practically`,ipa:`/ˈpræktɪkli/`,partOfSpeech:`adverb`,definition:`almost; nearly`,chinese:`几乎；简直`,example:`It was so crowded there was practically no room to breathe.`,exampleChinese:`太挤了，简直连呼吸的空间都没有。`}],expressions:[{id:`2-jam-packed`,phrase:`jam-packed`,explanation:`completely full of people or things`,chinese:`挤得水泄不通的；塞满的`,example:`The concert venue was jam-packed with excited fans.`,exampleChinese:`演唱会场地挤满了兴奋的歌迷。`},{id:`2-sardines`,phrase:`like sardines in a tin`,explanation:`very tightly packed together`,chinese:`像罐头里的沙丁鱼一样；挤得满满的`,example:`We were packed like sardines in the elevator.`,exampleChinese:`我们在电梯里挤得像沙丁鱼一样。`},{id:`2-rush-hour`,phrase:`rush hour`,explanation:`the time of day when traffic is heaviest, typically morning and evening`,chinese:`高峰时段；交通高峰期`,example:`I avoid driving during rush hour if I can help it.`,exampleChinese:`如果可以的话，我尽量不在高峰时段开车。`},{id:`2-no-choice`,phrase:`have no choice`,explanation:`to be unable to decide differently; forced to do something`,chinese:`别无选择`,example:`I had no choice but to take the last train home.`,exampleChinese:`我别无选择，只能坐末班车回家。`}],speak:{question:`Describe your daily commute or a memorable journey on public transport.`,prompts:[`How you usually travel to work or school`,`How long it takes and what it is like`,`About a particularly memorable journey`,`And explain how you feel about your daily commute`],modelAnswer:`I commute to work by subway every day, and honestly, it's not the most pleasant experience. The journey takes about 45 minutes each way, and during morning rush hour the trains are absolutely jam-packed — you're squeezed in like sardines in a tin, barely able to move. Once, I was wedged so tightly between two people that I couldn't even reach my phone to check messages. It was simultaneously hilarious and horrifying. On the bright side, I've become quite good at balancing without holding onto anything. The worst part is summer, when it's hot and sweaty and the air conditioning never seems to work properly. That said, I actually don't mind my commute most of the time — it gives me a chance to listen to podcasts or read before the workday starts. It's a bit of a buffer zone between home life and work life, if that makes sense. Still, I dream of the day I can work from home and skip the whole thing entirely.`,modelAnswerChinese:`我每天乘地铁通勤上班，说实话，这不是最愉快的经历。单程大约需要45分钟，早高峰的时候车厢挤得水泄不通——你就像罐头里的沙丁鱼一样被挤在里面，几乎动弹不得。有一次，我被挤在两个人中间，紧得连拿手机看消息都做不到。那场景既好笑又可怕。好的一面是，我已经非常擅长不抓扶手也能保持平衡了。最糟糕的是夏天，又热又汗，空调好像永远都不好使。话虽如此，大部分时间我其实并不介意通勤——它给了我一个机会，在工作日开始前听听播客或者读读书。这算是家庭生活和工作之间的一个缓冲区吧，不知道你能不能理解。不过，我还是梦想着有一天能在家工作，彻底不用通勤。`},quiz:[{id:`2-q1`,type:`multiple-choice`,question:`"Jam-packed" means:`,options:[`filled with jam`,`completely full`,`very loud`,`well-organised`],correctAnswer:`completely full`,explanation:`"Jam-packed" means completely full of people or things. 挤得水泄不通的。`},{id:`2-q2`,type:`fill-in-blank`,question:`People were packed like ______ in a tin on the bus.`,correctAnswer:`sardines`,explanation:`"Like sardines in a tin" is an idiom meaning very tightly packed together. 像沙丁鱼一样挤满了。`},{id:`2-q3`,type:`multiple-choice`,question:`What does "commute" refer to?`,options:[`A type of communication`,`The journey between home and work`,`A community event`,`A computer program`],correctAnswer:`The journey between home and work`,explanation:`"Commute" means the journey between home and work/school. 通勤。`},{id:`2-q4`,type:`matching`,question:`"wedge oneself in" means:`,options:[`to eat a sandwich`,`to force oneself into a small space`,`to wedge a door open`,`to sit comfortably`],correctAnswer:`to force oneself into a small space`,explanation:`"Wedge oneself in" means to force one's body into a narrow space. 挤入；楔入。`},{id:`2-q5`,type:`fill-in-blank`,question:`Rush ______ is the time when public transport is most crowded.`,correctAnswer:`hour`,explanation:`"Rush hour" = 高峰时段。The time of day when traffic/transport is heaviest.`}]},{id:3,title:`Breakfast Disaster`,subtitle:`Burnt toast and spilled milk`,sceneKey:`breakfast`,accentColor:`#FF6B6B`,story:[{english:`This morning, I decided to treat myself to a nice homemade breakfast before work.`,chinese:`今天早上，我决定在上班前好好犒劳自己一顿自制早餐。`},{english:`I put two slices of bread in the toaster and turned away to pour myself a glass of milk.`,chinese:`我把两片面包放进烤面包机，然后转身去倒一杯牛奶。`},{english:`One thing led to another, and I got distracted by my phone — by the time I remembered, the toast was completely burnt.`,chinese:`事情一件接一件，我被手机分散了注意力——等我想起来的时候，吐司已经完全烤糊了。`},{english:`In my panic, I knocked over the glass of milk, which spilled all over the kitchen counter.`,chinese:`慌乱中，我打翻了那杯牛奶，牛奶洒得整个厨房台面上都是。`},{english:`By the end of it all, I ended up grabbing a cereal bar and running out the door.`,chinese:`最后，我抓起一根谷物棒就冲出了门。`}],vocabulary:[{id:`3-distracted`,word:`distracted`,ipa:`/dɪˈstræktɪd/`,partOfSpeech:`adjective`,definition:`unable to concentrate because one is worried or thinking about something else`,chinese:`分心的；注意力不集中的`,example:`He seemed distracted during the meeting, checking his phone every few minutes.`,exampleChinese:`他开会时似乎心不在焉，每隔几分钟就看一次手机。`},{id:`3-burnt`,word:`burnt`,ipa:`/bɜːnt/`,partOfSpeech:`adjective`,definition:`damaged or injured by fire or heat`,chinese:`烧焦的；烤糊的`,example:`The toast was so burnt it was black at the edges.`,exampleChinese:`吐司烤得太糊了，边缘都黑了。`},{id:`3-panic`,word:`panic`,ipa:`/ˈpænɪk/`,partOfSpeech:`noun/verb`,definition:`a sudden feeling of great fear that prevents reasonable thought`,chinese:`惊慌；恐慌`,example:`When she realised she was late, she panicked.`,exampleChinese:`当她意识到迟到了，她慌了。`},{id:`3-spill`,word:`spill`,ipa:`/spɪl/`,partOfSpeech:`verb`,definition:`to cause liquid to flow over the edge of a container`,chinese:`洒；溢出`,example:`Be careful not to spill your coffee on the laptop.`,exampleChinese:`小心别把咖啡洒在笔记本电脑上。`},{id:`3-treat`,word:`treat`,ipa:`/triːt/`,partOfSpeech:`verb`,definition:`to do or give something special as a way of celebrating or rewarding`,chinese:`款待；犒劳`,example:`I treated myself to a spa day for my birthday.`,exampleChinese:`生日那天我犒劳自己去做了一天SPA。`},{id:`3-grab`,word:`grab`,ipa:`/ɡræb/`,partOfSpeech:`verb`,definition:`to take or get something quickly`,chinese:`抓起；匆忙拿走`,example:`Let me grab my coat and I will be right with you.`,exampleChinese:`让我拿一下外套，马上就来。`}],expressions:[{id:`3-one-thing-led`,phrase:`one thing led to another`,explanation:`an expression meaning one event caused another, which caused another, in a way that seems natural but unintended`,chinese:`事情一件接一件地发生；一来二去`,example:`We started chatting about our hobbies, and one thing led to another, we ended up going for dinner together.`,exampleChinese:`我们开始聊各自的爱好，一来二去，最后一起去吃了晚饭。`},{id:`3-end-up`,phrase:`end up doing something`,explanation:`to eventually do or become something, often unexpectedly`,chinese:`最终做了某事；结果是`,example:`I meant to study for just one hour, but I ended up staying up until midnight.`,exampleChinese:`我本来只想学一个小时，结果一直熬到了午夜。`},{id:`3-treat-oneself`,phrase:`treat oneself to something`,explanation:`to do or buy something special for oneself as a reward`,chinese:`犒劳自己；给自己买/做特别的东西`,example:`After finishing the project, I treated myself to a nice bottle of wine.`,exampleChinese:`完成项目后，我犒劳自己喝了一瓶好酒。`},{id:`3-knock-over`,phrase:`knock something over`,explanation:`to accidentally cause something to fall over`,chinese:`打翻；碰倒`,example:`The cat knocked over my glass of water this morning.`,exampleChinese:`今天早上猫打翻了我的水杯。`}],speak:{question:`Describe a time when you had a cooking disaster or made a mess in the kitchen.`,prompts:[`What you were trying to cook`,`What went wrong and how it happened`,`How you reacted and what you did about it`,`And explain what you learned from the experience`],modelAnswer:`Oh, I have so many stories like this. The most memorable one was when I tried to bake a birthday cake for my mum a few years ago. I'd never baked anything from scratch before, but I was feeling ambitious. I mixed the batter, popped it in the oven, and then sat down to watch a TV show while waiting. Well, one thing led to another — I got completely absorbed in the show and completely forgot about the cake. The next thing I knew, the smoke alarm was blaring. I ran to the kitchen in a panic and found the oven billowing with smoke. I pulled the cake out and it was completely burnt on top, like a charcoal briquette. I almost cried. In the end, I scraped off the burnt layer, covered the whole thing with lots of icing, and served it anyway. My mum was so sweet about it — she said it was the best cake she'd ever had. I know she was lying, but it still made me feel better. Since then, I've set at least three timers whenever I bake anything. Lesson learned.`,modelAnswerChinese:`哦，我有好多这样的故事。最难忘的一次是几年前我试着给我妈妈烤生日蛋糕的时候。我以前从来没有从头开始烤过东西，但那天我觉得自己挺有雄心的。我拌好面糊，放进烤箱，然后坐下来看电视等。结果呢，一来二去——我完全被节目吸引住了，彻底忘了蛋糕这回事。等我反应过来，烟雾报警器已经响得震天了。我慌慌张张跑进厨房，发现烤箱里浓烟滚滚。我把蛋糕拿出来，上面完全烤糊了，就像一块炭。我差点哭出来。最后，我把烤糊的那层刮掉，在整个蛋糕上涂了厚厚一层糖霜，还是端上去了。我妈妈特别贴心——她说这是她吃过的最好的蛋糕。我知道她在说谎，但还是让我好受多了。从那以后，我每次烤东西都至少定三个计时器。教训啊。`},quiz:[{id:`3-q1`,type:`multiple-choice`,question:`"One thing led to another" is used when:`,options:[`things happen one after another in an unplanned way`,`you follow a strict recipe`,`everything goes perfectly`,`you are very organised`],correctAnswer:`things happen one after another in an unplanned way`,explanation:`"One thing led to another" = 事情一件接一件地发生；一来二去。描述一连串自然但未计划的事件。`},{id:`3-q2`,type:`fill-in-blank`,question:`I decided to ______ myself to a nice breakfast before work.`,correctAnswer:`treat`,explanation:`"Treat oneself to something" = 犒劳自己。To do/buy something special as a reward.`},{id:`3-q3`,type:`multiple-choice`,question:`If you "end up doing something", it means you:`,options:[`planned to do it all along`,`eventually did it, often unexpectedly`,`never did it`,`regretted doing it`],correctAnswer:`eventually did it, often unexpectedly`,explanation:`"End up doing something" = 最终做了某事（常指出乎意料地）。`},{id:`3-q4`,type:`matching`,question:`"knock something over" means:`,options:[`to knock on a door`,`to accidentally cause something to fall`,`to hit someone`,`to finish a drink quickly`],correctAnswer:`to accidentally cause something to fall`,explanation:`"Knock something over" = 打翻；碰倒。比如打翻杯子。`},{id:`3-q5`,type:`fill-in-blank`,question:`If you are ______, you cannot concentrate on something.`,correctAnswer:`distracted`,explanation:`"Distracted" = 分心的。Unable to focus one's attention.`}]},{id:4,title:`Library Snooze`,subtitle:`Falling asleep on a pile of books`,sceneKey:`library`,accentColor:`#9B59B6`,story:[{english:`I headed to the library to cram for my upcoming IELTS exam, determined to study for at least five hours straight.`,chinese:`我去图书馆为即将到来的雅思考试突击复习，下定决心要至少连续学习五个小时。`},{english:`I piled up textbooks and practice papers around me, creating what looked like a fortress of knowledge.`,chinese:`我把课本和练习题堆在身边，形成了一座知识的堡垒。`},{english:`But the warm lighting and the quiet rustle of pages were surprisingly soothing.`,chinese:`但是温暖的灯光和书页轻轻的翻动声出奇地让人放松。`},{english:`Before I knew it, my eyelids grew heavy and my head nodded forward, landing on a particularly thick textbook.`,chinese:`不知不觉中，我的眼皮变得沉重，头往前一低，就落在了一本特别厚的课本上。`},{english:`I woke up an hour later with a book-shaped indentation on my cheek and a lot less study time than I had planned.`,chinese:`一个小时后我醒来，脸颊上压出了一道书形的印子，学习时间比我计划的少了很多。`}],vocabulary:[{id:`4-cram`,word:`cram`,ipa:`/kræm/`,partOfSpeech:`verb`,definition:`to study hard and quickly just before an exam`,chinese:`突击学习；死记硬背`,example:`I spent the whole weekend cramming for my final exam.`,exampleChinese:`我整个周末都在为期末考突击复习。`},{id:`4-soothing`,word:`soothing`,ipa:`/ˈsuːðɪŋ/`,partOfSpeech:`adjective`,definition:`having a calming or relaxing effect`,chinese:`舒缓的；让人放松的`,example:`The sound of rain is really soothing to me.`,exampleChinese:`雨声对我来说非常舒缓。`},{id:`4-lid`,word:`eyelid`,ipa:`/ˈaɪlɪd/`,partOfSpeech:`noun`,definition:`the piece of skin that covers and uncovers the eye`,chinese:`眼皮；眼睑`,example:`My eyelids grew heavy as the lecture dragged on.`,exampleChinese:`讲座拖沓冗长，我的眼皮越来越沉。`},{id:`4-indentation`,word:`indentation`,ipa:`/ˌɪndenˈteɪʃən/`,partOfSpeech:`noun`,definition:`a mark or cut that makes a surface not flat`,chinese:`凹痕；压痕`,example:`There was an indentation on the sofa where he had been sitting.`,exampleChinese:`沙发上他坐过的地方有一个压痕。`},{id:`4-fortress`,word:`fortress`,ipa:`/ˈfɔːtrəs/`,partOfSpeech:`noun`,definition:`a strong building used for defence; a place of protection`,chinese:`堡垒；要塞`,example:`The old fortress stood on top of the hill for centuries.`,exampleChinese:`那座古老的堡垒在山顶上屹立了几个世纪。`},{id:`4-determined`,word:`determined`,ipa:`/dɪˈtɜːmɪnd/`,partOfSpeech:`adjective`,definition:`having made a firm decision and not willing to change it`,chinese:`下定决心的；坚定的`,example:`She was determined to pass the exam on her first attempt.`,exampleChinese:`她下定决心要一次就通过考试。`}],expressions:[{id:`4-burn-midnight`,phrase:`burn the midnight oil`,explanation:`to work or study late into the night`,chinese:`熬夜学习/工作；挑灯夜战`,example:`I've been burning the midnight oil all week trying to finish this dissertation.`,exampleChinese:`我这一周都在熬夜，想完成这篇论文。`},{id:`4-before-knew`,phrase:`before I knew it`,explanation:`very quickly and unexpectedly; before one realises what has happened`,chinese:`不知不觉中；还没反应过来`,example:`We started chatting and before I knew it, three hours had passed.`,exampleChinese:`我们开始聊天，不知不觉中三个小时就过去了。`},{id:`4-head-nod`,phrase:`nod off`,explanation:`to fall asleep briefly, especially when sitting up`,chinese:`打盹儿；打瞌睡`,example:`I kept nodding off during the boring presentation.`,exampleChinese:`在那场无聊的演讲中，我不停地打盹儿。`},{id:`4-straight`,phrase:`for hours straight`,explanation:`continuously, without stopping`,chinese:`连续几个小时`,example:`She studied for four hours straight without taking a break.`,exampleChinese:`她连续学习了四个小时，没有休息。`}],speak:{question:`Describe a place where you like to study or work.`,prompts:[`Where this place is`,`What it looks like`,`What you do there`,`And explain why you like studying or working there`],modelAnswer:`My favourite place to study is the city library near my apartment. It's this beautiful old building with high ceilings and big windows that let in lots of natural light. The main reading room is absolutely massive — there are rows and rows of wooden tables and leather chairs, and the shelves go all the way up to the ceiling. I usually go there on weekends when I need to get some serious work done. I grab a coffee from the café downstairs, find a quiet corner, and settle in for hours. What I love most about it is the atmosphere — it's quiet but not completely silent. There's the soft rustle of pages, the occasional cough, the scraping of a chair. It sounds strange, but that gentle background noise is actually really soothing to me. It makes me feel like I'm part of a community of people who are all working hard. I'm way more productive there than I am at home, where I keep getting distracted by the fridge or the TV. The only problem is that it's so comfortable I sometimes accidentally nod off! But overall, it's basically my second home during exam season.`,modelAnswerChinese:`我最喜欢学习的地方是我公寓附近的市图书馆。那是一座漂亮的老建筑，天花板很高，大窗户透进来充足的自然光。主阅览室非常大——一排一排的木桌和皮椅，书架一直延伸到天花板。我通常周末需要认真学习的时候就去那里。我在楼下的咖啡馆买杯咖啡，找个安静的角落，然后安安稳稳地学好几个小时。我最喜欢的是那里的氛围——很安静但又不是完全死寂。有轻轻的翻书声，偶尔的咳嗽声，椅子移动的声音。听起来很奇怪，但那种温和的背景噪音对我来说其实非常舒缓。它让我觉得自己是一群都在努力学习的人中的一分子。我在那里的效率比在家高多了，在家我总是被冰箱或电视分心。唯一的问题是那里太舒服了，我有时候会不小心打瞌睡！但总的来说，考试季的时候那里基本上就是我的第二个家。`},quiz:[{id:`4-q1`,type:`multiple-choice`,question:`"Burn the midnight oil" means:`,options:[`to light a candle at night`,`to work or study late at night`,`to save electricity`,`to burn oil for heat`],correctAnswer:`to work or study late at night`,explanation:`"Burn the midnight oil" = 熬夜学习/工作；挑灯夜战。`},{id:`4-q2`,type:`fill-in-blank`,question:`If you study for 5 hours ______, you study continuously without stopping.`,correctAnswer:`straight`,explanation:`"For hours straight" = 连续几个小时不间断。Continuously, without stopping.`},{id:`4-q3`,type:`multiple-choice`,question:`"Cram" for an exam means:`,options:[`to eat quickly`,`to study hard just before the exam`,`to take a nap`,`to fill a room with people`],correctAnswer:`to study hard just before the exam`,explanation:`"Cram" = 突击复习；考前死记硬背。To study intensively right before an exam.`},{id:`4-q4`,type:`matching`,question:`"nod off" means:`,options:[`to shake your head`,`to agree with someone`,`to fall asleep briefly`,`to greet someone`],correctAnswer:`to fall asleep briefly`,explanation:`"Nod off" = 打盹儿；打瞌睡。To fall asleep briefly, especially while sitting up.`},{id:`4-q5`,type:`fill-in-blank`,question:`"______ I knew it" means something happened very quickly and unexpectedly.`,correctAnswer:`Before`,explanation:`"Before I knew it" = 不知不觉中；还没反应过来。`}]},{id:5,title:`Cafeteria Chaos`,subtitle:`Too hungry to decide what to eat`,sceneKey:`cafeteria`,accentColor:`#FF9F43`,story:[{english:`By lunchtime, I am absolutely ravenous — my stomach has been growling for the past hour.`,chinese:`到了午餐时间，我已经饿得不行了——过去一个小时我的肚子一直在咕咕叫。`},{english:`The cafeteria is bustling with people, all queueing up for the daily specials.`,chinese:`自助餐厅里人来人往，大家都在排队等着今天的特色菜。`},{english:`I am so hungry that I feel overwhelmed by the choices — everything looks delicious.`,chinese:`我太饿了，面对选择不知所措——每一样看起来都很好吃。`},{english:`After hovering indecisively for several minutes, I finally settle on a heaping plate of food.`,chinese:`犹豫不决地徘徊了几分钟后，我终于选定了满满一盘食物。`},{english:`I find a table and dig in, feeling like I have not eaten in days.`,chinese:`我找了张桌子，狼吞虎咽地吃起来，感觉自己好像好几天没吃饭了。`}],vocabulary:[{id:`5-ravenous`,word:`ravenous`,ipa:`/ˈrævənəs/`,partOfSpeech:`adjective`,definition:`extremely hungry`,chinese:`极度饥饿的；饿极了的`,example:`After hiking all morning, we were absolutely ravenous.`,exampleChinese:`徒步走了一上午后，我们饿极了。`},{id:`5-growl`,word:`growl`,ipa:`/ɡraʊl/`,partOfSpeech:`verb`,definition:`to make a low, rumbling sound`,chinese:`（肚子）咕咕叫；低吼`,example:`My stomach growled so loudly in the meeting that everyone turned to look.`,exampleChinese:`我的肚子在会上叫得那么大声，所有人都转过头来看。`},{id:`5-bustling`,word:`bustling`,ipa:`/ˈbʌslɪŋ/`,partOfSpeech:`adjective`,definition:`full of busy, noisy activity`,chinese:`熙熙攘攘的；忙忙碌碌的`,example:`The market is always bustling on Saturday mornings.`,exampleChinese:`周六早上市场总是熙熙攘攘的。`},{id:`5-overwhelmed`,word:`overwhelmed`,ipa:`/ˌəʊvəˈwelmd/`,partOfSpeech:`adjective`,definition:`feeling completely overcome or defeated by something`,chinese:`不知所措的；被压垮的`,example:`She felt overwhelmed by the amount of work she had to do.`,exampleChinese:`面对要做的工作，她感到不堪重负。`},{id:`5-indecisive`,word:`indecisive`,ipa:`/ˌɪndɪˈsaɪsɪv/`,partOfSpeech:`adjective`,definition:`unable to make decisions quickly or firmly`,chinese:`优柔寡断的；犹豫不决的`,example:`He is so indecisive that he takes forever to order at restaurants.`,exampleChinese:`他太优柔寡断了，在餐馆点菜总要花很长时间。`},{id:`5-heaping`,word:`heaping`,ipa:`/ˈhiːpɪŋ/`,partOfSpeech:`adjective`,definition:`formed into a large pile`,chinese:`堆满的；满满的`,example:`She served herself a heaping bowl of rice.`,exampleChinese:`她给自己盛了满满一碗饭。`}],expressions:[{id:`5-dig-in`,phrase:`dig in`,explanation:`to start eating food with enthusiasm`,chinese:`开始大快朵颐；狼吞虎咽地吃`,example:`The food smelled amazing, so we all dug in immediately.`,exampleChinese:`食物闻起来太棒了，所以我们立刻开始狼吞虎咽。`},{id:`5-settle-on`,phrase:`settle on something`,explanation:`to finally decide on something after considering several options`,chinese:`最终选定；拿定主意`,example:`After trying on five dresses, she finally settled on the red one.`,exampleChinese:`试了五条裙子之后，她最终选定了那条红色的。`},{id:`5-daily-special`,phrase:`daily special`,explanation:`a dish offered in a restaurant on a particular day, usually at a lower price`,chinese:`今日特餐；每日特价菜`,example:`Let's see what the daily special is before we order.`,exampleChinese:`我们点之前先看看今天的特餐是什么。`},{id:`5-hover`,phrase:`hover indecisively`,explanation:`to move around uncertainly, unable to make a choice`,chinese:`犹豫不决地徘徊`,example:`He hovered indecisively in front of the menu, unable to choose.`,exampleChinese:`他在菜单前犹豫不决地徘徊，没法做选择。`}],speak:{question:`Describe a meal you enjoyed at a restaurant or cafeteria.`,prompts:[`Where and when you had this meal`,`What you ate`,`Who you were with`,`And explain why you enjoyed this meal so much`],modelAnswer:`One meal that really stands out in my memory was a lunch I had at a tiny family-run restaurant in Kyoto a couple of years ago. I was travelling alone and was absolutely ravenous after a morning of walking around temples. The place was tiny — there were only about six seats at the counter — and the owner, an elderly man, was doing all the cooking himself. I didn't really know what to order, so I just pointed to a picture of a ramen set. It came out a few minutes later and looked incredible — a big bowl of rich, steaming tonkotsu ramen, plus a side of gyoza and a small plate of pickled vegetables. I dug in and it was absolutely delicious. The broth was so flavourful, the noodles were perfectly chewy, and the pork was melt-in-your-mouth tender. What made it really special though was the atmosphere. The owner didn't speak much English and I don't speak much Japanese, but we smiled at each other and communicated through gestures. It was simple, honest, and somehow really comforting. I still think about that meal sometimes. It wasn't the fanciest or most expensive meal I've ever had, but it was perfect in its own way.`,modelAnswerChinese:`我记忆中特别难忘的一顿饭是几年前在京都一家很小的家庭餐厅吃的午餐。我当时一个人旅行，逛了一上午寺庙，已经饿得不行了。那家店很小——柜台前只有大约六个座位——老板是一位老人家，所有的菜都是他自己做的。我不太知道该点什么，就指着一张拉面套餐的图片点了。几分钟后端上来，看起来棒极了——一大碗热气腾腾的浓郁豚骨拉面，外加一盘煎饺和一小碟腌菜。我狼吞虎咽地吃起来，真的太美味了。汤头浓郁可口，面条劲道刚好，猪肉入口即化。不过真正让它特别的是那里的氛围。老板不太会说英语，我也不太会说日语，但我们互相微笑，用手势交流。那顿饭简单、实在，不知怎么的让人感觉特别温暖。我有时候还会想起那顿饭。它不是我吃过的最精致或最贵的一餐，但它有自己独特的完美。`},quiz:[{id:`5-q1`,type:`multiple-choice`,question:`"Ravenous" means:`,options:[`very angry`,`extremely hungry`,`very tired`,`extremely happy`],correctAnswer:`extremely hungry`,explanation:`"Ravenous" = 极度饥饿的。Extremely hungry.`},{id:`5-q2`,type:`fill-in-blank`,question:`"______ in" means to start eating with great enthusiasm.`,correctAnswer:`Dig`,explanation:`"Dig in" = 开始大快朵颐。To start eating eagerly.`},{id:`5-q3`,type:`multiple-choice`,question:`If you "settle on" something, you:`,options:[`sit down on it`,`finally decide on it`,`reject it`,`pay for it`],correctAnswer:`finally decide on it`,explanation:`"Settle on something" = 最终选定。To finally decide after considering options.`},{id:`5-q4`,type:`matching`,question:`"bustling" describes a place that is:`,options:[`very quiet`,`full of busy activity`,`completely empty`,`very dirty`],correctAnswer:`full of busy activity`,explanation:`"Bustling" = 熙熙攘攘的。Full of busy, noisy activity.`},{id:`5-q5`,type:`fill-in-blank`,question:`A "______ special" is a dish offered on a particular day at a restaurant.`,correctAnswer:`daily`,explanation:`"Daily special" = 今日特餐；每日特价菜。`}]},{id:6,title:`Gym Workout Fail`,subtitle:`Struggling with dumbbells`,sceneKey:`gym`,accentColor:`#6C5CE7`,story:[{english:`I walked into the gym feeling determined — today was the day I would finally get serious about working out.`,chinese:`我走进健身房，斗志昂扬——今天我终于要认真锻炼了。`},{english:`I confidently picked up what I thought was a light pair of dumbbells, ready to impress everyone around me.`,chinese:`我自信地拿起一对我觉得很轻的哑铃，准备给周围的人留下深刻印象。`},{english:`As soon as I lifted them, I realised I had severely overestimated my strength.`,chinese:`我刚一举起来，就意识到我严重高估了自己的力量。`},{english:`My arms started shaking and my face turned bright red as I struggled through a few pathetic reps.`,chinese:`我的胳膊开始发抖，脸涨得通红，艰难地做了几个可怜巴巴的动作。`},{english:`I quickly put the dumbbells back and sheepishly walked over to the much lighter ones, feeling a bit humbled.`,chinese:`我赶紧把哑铃放回去，不好意思地走到轻得多的那些哑铃旁边，感觉有点被现实打脸了。`}],vocabulary:[{id:`6-determined`,word:`determined`,ipa:`/dɪˈtɜːmɪnd/`,partOfSpeech:`adjective`,definition:`having made a firm decision and being resolved not to change it`,chinese:`坚定的；下定决心的`,example:`She was determined to succeed no matter what.`,exampleChinese:`她下定决心无论如何都要成功。`},{id:`6-overestimate`,word:`overestimate`,ipa:`/ˌəʊvərˈestɪmeɪt/`,partOfSpeech:`verb`,definition:`to estimate or judge something to be greater than it really is`,chinese:`高估`,example:`I think you are overestimating how long this project will take.`,exampleChinese:`我觉得你高估了这个项目需要的时间。`},{id:`6-struggle`,word:`struggle`,ipa:`/ˈstrʌɡəl/`,partOfSpeech:`verb`,definition:`to try very hard to do something difficult`,chinese:`挣扎；艰难地做`,example:`He struggled to carry all the shopping bags by himself.`,exampleChinese:`他一个人艰难地提着所有购物袋。`},{id:`6-sheepishly`,word:`sheepishly`,ipa:`/ˈʃiːpɪʃli/`,partOfSpeech:`adverb`,definition:`in an embarrassed or ashamed way, like a sheep`,chinese:`不好意思地；局促地`,example:`He smiled sheepishly when he realised he had walked into the wrong room.`,exampleChinese:`当他意识到自己走错了房间，不好意思地笑了笑。`},{id:`6-humbled`,word:`humbled`,ipa:`/ˈhʌmbəld/`,partOfSpeech:`adjective`,definition:`feeling less important or proud because of something that has happened`,chinese:`感到谦卑的；被挫了锐气的`,example:`The experience left me feeling humbled and grateful.`,exampleChinese:`这段经历让我感到谦卑和感恩。`},{id:`6-pathetic`,word:`pathetic`,ipa:`/pəˈθetɪk/`,partOfSpeech:`adjective`,definition:`very bad, weak, or unsuccessful`,chinese:`可怜的；差劲的`,example:`My attempt at cooking was pretty pathetic.`,exampleChinese:`我那次做饭的尝试相当失败。`}],expressions:[{id:`6-get-serious`,phrase:`get serious about something`,explanation:`to start treating something as important and deserving of effort`,chinese:`认真对待某事`,example:`I need to get serious about learning English if I want to study abroad.`,exampleChinese:`如果我想出国留学，就必须认真对待英语学习。`},{id:`6-bright-red`,phrase:`turn bright red`,explanation:`to become very red in the face, usually from embarrassment or exertion`,chinese:`（脸）涨得通红`,example:`When they sang happy birthday to her, she turned bright red.`,exampleChinese:`当他们给她唱生日歌时，她的脸涨得通红。`},{id:`6-work-out`,phrase:`work out`,explanation:`to exercise, especially in a gym`,chinese:`锻炼；健身`,example:`I try to work out at least three times a week.`,exampleChinese:`我尽量每周至少锻炼三次。`},{id:`6-reps`,phrase:`do reps`,explanation:`short for "repetitions" — the number of times you do an exercise`,chinese:`做动作次数（repetitions的缩写）`,example:`I usually do three sets of twelve reps for each exercise.`,exampleChinese:`我每个动作通常做三组，每组12次。`}],speak:{question:`Describe a time you tried something new and found it more difficult than expected.`,prompts:[`What you tried to do`,`Why you thought it would be easy`,`What made it difficult`,`And explain what you learned from the experience`],modelAnswer:`A couple of months ago, I decided I wanted to get into rock climbing. I'd seen people doing it on social media and it looked so cool and effortless. I thought, 'I'm reasonably fit, this should be easy.' So I signed up for a beginner class at a climbing gym near my place. When I got there, the instructor showed us the basics — how to tie a knot, how to use the holds, that kind of thing. It all seemed straightforward. Then it was my turn to climb. I grabbed the first hold and pulled myself up — and immediately realised I had massively overestimated my upper body strength. My arms were shaking within thirty seconds. I couldn't even make it halfway up the easiest wall. I kept slipping and my hands started sweating and I just couldn't go any higher. I was so embarrassed — my face turned bright red and I wanted to leave immediately. But the instructor was really encouraging. She told me that everyone struggles at first and that I should just focus on having fun. I ended up staying for the whole class and even went back the next week. I'm still not very good, but I'm slowly getting better. What I learned is that everything looks easy until you actually try it. And it's okay to be bad at something when you're starting out — that's how you get better.`,modelAnswerChinese:`几个月前，我决定开始玩攀岩。我在社交媒体上看到别人玩，看起来又酷又轻松。我想："我身体还不错，这应该不难。" 于是我在住处附近的攀岩馆报了一个初级班。到了那里，教练教了我们一些基础——怎么打结、怎么抓手点之类的。看起来都挺简单的。然后就轮到我爬了。我抓住第一个手点往上拉——立刻意识到我严重高估了自己的上肢力量。我的胳膊三十秒内就开始发抖。最简单的墙我连一半都爬不到。我不停地打滑，手心开始出汗，就是爬不上去了。我特别尴尬——脸涨得通红，想立刻就走。但教练特别鼓励我。她说每个人一开始都很挣扎，我应该专注于享受乐趣。最后我留下来上完了整堂课，第二周甚至又去了。我还是不太擅长，但慢慢在进步。我学到的是：任何事情在你真正尝试之前看起来都很容易。而且刚开始的时候做得不好是正常的——那正是你进步的方式。`},quiz:[{id:`6-q1`,type:`multiple-choice`,question:`"Overestimate" means:`,options:[`to underestimate`,`to judge something as greater than it really is`,`to estimate correctly`,`to look over something`],correctAnswer:`to judge something as greater than it really is`,explanation:`"Overestimate" = 高估。To estimate something as larger/better/greater than it really is.`},{id:`6-q2`,type:`fill-in-blank`,question:`I need to get ______ about my studies if I want to pass the exam.`,correctAnswer:`serious`,explanation:`"Get serious about something" = 认真对待某事。`},{id:`6-q3`,type:`multiple-choice`,question:`If someone smiles "sheepishly", they feel:`,options:[`very proud`,`embarrassed or shy`,`extremely angry`,`very excited`],correctAnswer:`embarrassed or shy`,explanation:`"Sheepishly" = 不好意思地；局促地。In an embarrassed or shy way.`},{id:`6-q4`,type:`matching`,question:`"work out" means:`,options:[`to solve a problem`,`to exercise, especially in a gym`,`to go to work`,`to leave work early`],correctAnswer:`to exercise, especially in a gym`,explanation:`"Work out" = 锻炼；健身。To exercise, especially at a gym.`},{id:`6-q5`,type:`fill-in-blank`,question:`In weight training, "reps" is short for "______".`,correctAnswer:`repetitions`,explanation:`"Reps" = repetitions 的缩写，即动作重复的次数。`}]},{id:7,title:`Grocery Shopping`,subtitle:`Overflowing shopping bags`,sceneKey:`grocery`,accentColor:`#00B894`,story:[{english:`I went to the supermarket on the weekend to stock up on groceries for the whole week.`,chinese:`周末我去超市采购了整整一周的食材。`},{english:`I wandered up and down the aisles, tossing things into my trolley without really paying attention to how much I was buying.`,chinese:`我在过道里逛来逛去，随手把东西扔进购物车里，完全没注意自己买了多少。`},{english:`By the time I got to the checkout, my trolley was overflowing with food and household items.`,chinese:`等我到收银台的时候，我的购物车里堆满了食品和日用品。`},{english:`I struggled to carry all the bags home — my hands were sore and the bags kept cutting into my fingers.`,chinese:`我费劲地把所有袋子拎回家——手很酸，袋子不停地勒着我的手指。`},{english:`But at least I will not have to go grocery shopping again for a while.`,chinese:`不过至少我一段时间内不用再去买菜了。`}],vocabulary:[{id:`7-stock-up`,word:`stock up`,ipa:`/ˈstɒk ʌp/`,partOfSpeech:`phrasal verb`,definition:`to buy a large quantity of something to keep for later`,chinese:`囤积；大量储备`,example:`We always stock up on instant noodles before a long holiday.`,exampleChinese:`长假前我们总会囤很多方便面。`},{id:`7-wander`,word:`wander`,ipa:`/ˈwɒndə/`,partOfSpeech:`verb`,definition:`to walk around slowly without a clear direction or purpose`,chinese:`闲逛；漫步`,example:`We spent the afternoon wandering around the old town.`,exampleChinese:`我们下午在老城里闲逛。`},{id:`7-toss`,word:`toss`,ipa:`/tɒs/`,partOfSpeech:`verb`,definition:`to throw something lightly or casually`,chinese:`扔；抛`,example:`She tossed her keys onto the table and collapsed onto the sofa.`,exampleChinese:`她把钥匙扔在桌上，瘫倒在沙发上。`},{id:`7-overflowing`,word:`overflowing`,ipa:`/ˌəʊvəˈfləʊɪŋ/`,partOfSpeech:`adjective`,definition:`filled beyond capacity; spilling over the edges`,chinese:`溢出的；满得要溢出来的`,example:`The bin was overflowing with rubbish.`,exampleChinese:`垃圾桶满得都溢出来了。`},{id:`7-sore`,word:`sore`,ipa:`/sɔː/`,partOfSpeech:`adjective`,definition:`painful and aching`,chinese:`酸痛的；疼的`,example:`My legs were sore after running the marathon.`,exampleChinese:`跑完马拉松后我的腿很酸痛。`},{id:`7-trolley`,word:`trolley`,ipa:`/ˈtrɒli/`,partOfSpeech:`noun`,definition:`a wheeled cart used for carrying things, especially shopping (UK)`,chinese:`购物车（英式）`,example:`You can find shopping trolleys near the entrance.`,exampleChinese:`入口附近你可以找到购物车。`}],expressions:[{id:`7-up-down`,phrase:`up and down the aisles`,explanation:`walking back and forth along the rows of shelves in a shop`,chinese:`在货架通道里来回走`,example:`I spent ages going up and down the aisles looking for canned tomatoes.`,exampleChinese:`我花了好长时间在货架通道里来回找番茄罐头。`},{id:`7-cut-into`,phrase:`cut into your fingers/hands`,explanation:`when something thin and heavy presses painfully into your skin`,chinese:`勒手；勒进皮肤`,example:`The thin plastic bag was cutting into my fingers.`,exampleChinese:`薄薄的塑料袋勒得我的手指生疼。`},{id:`7-checkout`,phrase:`the checkout`,explanation:`the place in a supermarket where you pay for your goods`,chinese:`收银台；结账处`,example:`There was a long queue at the checkout.`,exampleChinese:`收银台前排着长队。`},{id:`7-for-a-while`,phrase:`for a while`,explanation:`for a period of time`,chinese:`一段时间；一会儿`,example:`I am going to take a break from social media for a while.`,exampleChinese:`我打算暂时不用社交媒体一段时间。`}],speak:{question:`Describe a shopping trip you went on recently.`,prompts:[`Where you went and what you needed to buy`,`Who you went with`,`What happened during the trip`,`And explain whether you enjoy shopping and why`],modelAnswer:`Last Saturday I went grocery shopping at the big supermarket near my flat. I usually go on Sundays, but I had plans that day so I went a day early. I went alone, which is my favourite way to grocery shop — I can take my time and browse. My original plan was just to pick up a few essentials for the week: milk, bread, eggs, some vegetables. But you know how it goes — I wandered up and down the aisles and one thing led to another. I ended up with a trolley overflowing with all sorts of things I didn't really need: three different types of cheese, a giant bag of crisps, some fancy olive oil. By the time I got to the checkout, I was actually a bit shocked at how much I'd accumulated. Carrying all the bags home was a nightmare — the plastic handles kept cutting into my fingers and I had to stop and rest several times. That said, I actually quite enjoy grocery shopping. I find it weirdly relaxing. There's something satisfying about walking up and down the aisles, comparing products, and planning meals for the week. It's one of those simple, mundane things that I find oddly comforting. I just need to stop impulse-buying so much junk food.`,modelAnswerChinese:`上周六我去了公寓附近的大超市买菜。我通常周日去，但那天有事所以提前了一天。我一个人去的，这是我最喜欢的买菜方式——我可以慢慢逛，随便看。我本来只打算买几样这周需要的必需品：牛奶、面包、鸡蛋、一些蔬菜。但你知道的——我在过道里逛来逛去，一来二去就买多了。最后购物车里堆满了各种我其实不太需要的东西：三种不同的奶酪、一大袋薯片、一瓶高级橄榄油。到收银台的时候，我自己都有点震惊居然买了这么多。把所有袋子拎回家简直是噩梦——塑料袋的提手一直勒着我的手指，我不得不停下来休息好几次。话虽如此，我其实挺喜欢买菜的。我觉得它莫名地让人放松。在货架通道里走来走去、比较产品、规划一周的饭菜，这其中有种满足感。这是那种简单、平凡但又奇怪地让人安心的事情之一。我只是需要别再冲动买那么多垃圾食品了。`},quiz:[{id:`7-q1`,type:`multiple-choice`,question:`"Stock up on something" means:`,options:[`to sell everything`,`to buy a large quantity for later`,`to run out of stock`,`to throw things away`],correctAnswer:`to buy a large quantity for later`,explanation:`"Stock up on something" = 囤积；大量储备。To buy a lot of something to keep for later.`},{id:`7-q2`,type:`fill-in-blank`,question:`If a container is ______, it is so full that things are spilling out.`,correctAnswer:`overflowing`,explanation:`"Overflowing" = 溢出的；满得要溢出来的。Filled beyond capacity.`},{id:`7-q3`,type:`multiple-choice`,question:`"Wander" means to walk:`,options:[`very quickly`,`with a clear purpose`,`slowly without a clear direction`,`backwards`],correctAnswer:`slowly without a clear direction`,explanation:`"Wander" = 闲逛；漫步。To walk around slowly without a clear direction.`},{id:`7-q4`,type:`matching`,question:`"the checkout" is:`,options:[`where you enter the shop`,`where you try on clothes`,`where you pay for your shopping`,`where you park your car`],correctAnswer:`where you pay for your shopping`,explanation:`"The checkout" = 收银台；结账处。The place in a shop where you pay.`},{id:`7-q5`,type:`fill-in-blank`,question:`After carrying heavy bags, my hands were ______ (painful and aching).`,correctAnswer:`sore`,explanation:`"Sore" = 酸痛的。Painful and aching.`}]},{id:8,title:`Sudden Downpour`,subtitle:`Forgotten umbrella and soaking wet`,sceneKey:`rain`,accentColor:`#74B9FF`,story:[{english:`The morning started off sunny and clear, so I left my umbrella at home — what a mistake that was.`,chinese:`早上出门时阳光明媚，所以我把伞留在了家里——这真是个大错误。`},{english:`By mid-afternoon, dark clouds rolled in and the sky opened up with a sudden heavy downpour.`,chinese:`下午三四点钟，乌云滚滚而来，天空突然下起了倾盆大雨。`},{english:`I rummaged through my bag desperately and found my umbrella — but it was inside out from the last time I used it.`,chinese:`我拼命在包里翻找，找到了我的伞——但上次用完之后它是翻折着的。`},{english:`I tried to fix it in the rain, but by the time I got it open, I was already drenched.`,chinese:`我试着在雨中把它弄好，但等我撑开的时候，我已经浑身湿透了。`},{english:`I squelched all the way home, leaving a trail of water wherever I went.`,chinese:`我一路上啪嗒啪嗒地走回家，走到哪儿就把水带到哪儿。`}],vocabulary:[{id:`8-downpour`,word:`downpour`,ipa:`/ˈdaʊnpɔː/`,partOfSpeech:`noun`,definition:`a heavy and sudden fall of rain`,chinese:`倾盆大雨；暴雨`,example:`We got caught in a sudden downpour on our way home.`,exampleChinese:`我们回家的路上遇上了突如其来的倾盆大雨。`},{id:`8-drenched`,word:`drenched`,ipa:`/ˈdrentʃt/`,partOfSpeech:`adjective`,definition:`completely wet; soaked`,chinese:`湿透的；淋透的`,example:`We got drenched in the rain and had to go home to change.`,exampleChinese:`我们被雨淋得浑身湿透，不得不回家换衣服。`},{id:`8-rummage`,word:`rummage`,ipa:`/ˈrʌmɪdʒ/`,partOfSpeech:`verb`,definition:`to search for something by moving things around in a careless way`,chinese:`翻找；搜寻`,example:`She rummaged through her handbag looking for her keys.`,exampleChinese:`她在手提包里翻找钥匙。`},{id:`8-squelch`,word:`squelch`,ipa:`/skweltʃ/`,partOfSpeech:`verb`,definition:`to make a wet sucking sound when walking through mud or water`,chinese:`（在水中走时）发出咯吱咯吱声；啪嗒啪嗒地走`,example:`We squelched through the muddy field in our wellies.`,exampleChinese:`我们穿着雨靴在泥泞的田地里咯吱咯吱地走。`},{id:`8-roll-in`,word:`roll in`,ipa:`/rəʊl ɪn/`,partOfSpeech:`phrasal verb`,definition:`to move or arrive in large numbers, often gradually`,chinese:`滚滚而来；大量涌入`,example:`Dark clouds rolled in from the west.`,exampleChinese:`乌云从西边滚滚而来。`},{id:`8-inside-out`,word:`inside out`,ipa:`/ˌɪnsaɪd ˈaʊt/`,partOfSpeech:`adverb`,definition:`with the inner side turned outward`,chinese:`里面翻到外面地；翻折着地`,example:`My umbrella turned inside out in the strong wind.`,exampleChinese:`我的伞在大风中被吹得翻了过去。`}],expressions:[{id:`8-sky-opened`,phrase:`the sky opened up`,explanation:`it suddenly started raining very heavily`,chinese:`天空突然下起了倾盆大雨`,example:`We were halfway through the picnic when the sky opened up.`,exampleChinese:`我们野餐到一半，突然下起了倾盆大雨。`},{id:`8-caught-in-rain`,phrase:`get caught in the rain`,explanation:`to be outside when it starts raining unexpectedly`,chinese:`被雨淋了；赶上雨了`,example:`I got caught in the rain on my way to work and my suit got ruined.`,exampleChinese:`我上班路上被雨淋了，西装都毁了。`},{id:`8-what-a-mistake`,phrase:`what a mistake that was`,explanation:`an expression used to show that something was a very bad decision`,chinese:`那真是个大错误`,example:`I decided to drive during rush hour — what a mistake that was.`,exampleChinese:`我决定在高峰时段开车——那真是个大错误。`},{id:`8-trail-of-water`,phrase:`leave a trail of water`,explanation:`to leave behind a line of water drops as you walk`,chinese:`留下一串水迹`,example:`The dog came in from the rain and left a trail of water all over the floor.`,exampleChinese:`狗从雨中跑进来，在地板上留下了一串水迹。`}],speak:{question:`Describe a time when the weather ruined your plans.`,prompts:[`What you had planned to do`,`What the weather was like`,`How your plans were affected`,`And explain how you felt about it`],modelAnswer:`Last summer, my friends and I had planned a big picnic in the park for my birthday. We'd been talking about it for weeks — we were going to bring sandwiches and fruit and cake, play frisbee, maybe even go for a boat ride on the lake. I checked the weather forecast the night before and it said it would be sunny and warm all day. The morning started off beautifully — clear blue sky, warm sunshine. We laid out a big blanket and got everything ready. We were just about to cut the cake when dark clouds rolled in out of nowhere. Within five minutes the sky opened up and it was pouring. We scrambled to pack everything up but we all got absolutely drenched. The cake got ruined, the sandwiches were soggy, everything was a mess. We ran back to my place, dripping wet and laughing. In the end, we ordered pizza and watched movies instead. Even though the picnic was completely ruined, I actually still had a really good time. Sometimes the unplanned days turn out to be the most memorable ones. But I did learn my lesson — now I always bring an umbrella with me, no matter what the forecast says.`,modelAnswerChinese:`去年夏天，我和朋友们计划在公园里举办一场盛大的野餐来庆祝我的生日。我们已经商量了好几个星期——我们打算带三明治、水果和蛋糕，玩飞盘，甚至可能去湖上划船。头天晚上我查了天气预报，说一整天都会晴朗温暖。早上开始的时候天气特别好——蓝天清澈，阳光温暖。我们铺了一张大毯子，把所有东西都准备好了。我们正要切蛋糕的时候，不知从哪儿冒出来的乌云滚滚而来。不到五分钟，天空就像开了闸一样，大雨倾盆而下。我们手忙脚乱地收拾东西，但所有人都淋得浑身湿透。蛋糕毁了，三明治泡汤了，一切都一团糟。我们跑回我家，浑身滴着水，还笑个不停。最后，我们改点了披萨，看了电影。尽管野餐彻底泡汤了，但我其实还是玩得很开心。有时候那些不在计划中的日子反而最难忘。不过我确实吸取了教训——现在不管天气预报怎么说，我都总是带着伞。`},quiz:[{id:`8-q1`,type:`multiple-choice`,question:`"Downpour" means:`,options:[`a light rain`,`a heavy sudden rain`,`snowfall`,`wind`],correctAnswer:`a heavy sudden rain`,explanation:`"Downpour" = 倾盆大雨。A heavy and sudden fall of rain.`},{id:`8-q2`,type:`fill-in-blank`,question:`If you are completely wet from rain, you are ______.`,correctAnswer:`drenched`,explanation:`"Drenched" = 湿透的；淋透的。Completely wet; soaked.`},{id:`8-q3`,type:`multiple-choice`,question:`"The sky opened up" means:`,options:[`it became very sunny`,`it suddenly rained heavily`,`there was an earthquake`,`the clouds disappeared`],correctAnswer:`it suddenly rained heavily`,explanation:`"The sky opened up" = 天空突然下起了倾盆大雨。`},{id:`8-q4`,type:`matching`,question:`"rummage through something" means:`,options:[`to eat quickly`,`to search by moving things around`,`to throw things away`,`to organise neatly`],correctAnswer:`to search by moving things around`,explanation:`"Rummage through" = 翻找。To search carelessly by moving things around.`},{id:`8-q5`,type:`fill-in-blank`,question:`An umbrella that has turned ______ out has its inner side facing outward.`,correctAnswer:`inside`,explanation:`"Inside out" = 里面翻到外面地。With the inner side turned outward.`}]},{id:9,title:`WFH Video Call`,subtitle:`Pet walking across the keyboard`,sceneKey:`wfh`,accentColor:`#FDCB6E`,story:[{english:`Working from home has its perks, but it also comes with its fair share of distractions.`,chinese:`在家工作有它的好处，但也有相当多的干扰。`},{english:`Yesterday, I was in an important video call with clients from overseas.`,chinese:`昨天，我正在和海外客户进行一场重要的视频会议。`},{english:`Midway through my presentation, my cat decided to walk right across my keyboard, stepping on every key.`,chinese:`我汇报到一半的时候，我的猫径直从键盘上走过去，踩遍了每一个按键。`},{english:`My screen started going crazy — windows opening and closing, text being typed randomly, everything going haywire.`,chinese:`我的屏幕开始疯了——窗口不停地开开关关，随机打出字来，一切都乱了套。`},{english:`I frantically tried to grab my cat while apologising to the clients, who found it absolutely hilarious.`,chinese:`我一边疯狂地想抓住我的猫，一边向客户道歉，而客户们觉得这简直太好笑了。`}],vocabulary:[{id:`9-perks`,word:`perks`,ipa:`/pɜːks/`,partOfSpeech:`noun (plural)`,definition:`advantages or benefits of something, especially a job`,chinese:`好处；福利；额外待遇`,example:`One of the perks of this job is the free gym membership.`,exampleChinese:`这份工作的福利之一是免费的健身房会员。`},{id:`9-distraction`,word:`distraction`,ipa:`/dɪˈstrækʃən/`,partOfSpeech:`noun`,definition:`something that prevents you from concentrating`,chinese:`分心的事物；干扰`,example:`Social media is my biggest distraction when I am trying to study.`,exampleChinese:`社交媒体是我学习时最大的干扰。`},{id:`9-midway`,word:`midway`,ipa:`/ˌmɪdˈweɪ/`,partOfSpeech:`adverb`,definition:`in the middle of a process or period of time`,chinese:`中途；在中间`,example:`The speaker stopped midway through his talk to take a sip of water.`,exampleChinese:`演讲者讲到中途停下来喝了一口水。`},{id:`9-frantically`,word:`frantically`,ipa:`/ˈfræntɪkli/`,partOfSpeech:`adverb`,definition:`in a hurried, excited, and uncontrolled way`,chinese:`疯狂地；慌乱地`,example:`She frantically searched for her passport before the trip.`,exampleChinese:`出发前她疯狂地找她的护照。`},{id:`9-hilarious`,word:`hilarious`,ipa:`/hɪˈleəriəs/`,partOfSpeech:`adjective`,definition:`extremely funny`,chinese:`极其滑稽的；非常好笑的`,example:`The movie was absolutely hilarious — I laughed the whole way through.`,exampleChinese:`那部电影太搞笑了——我从头笑到尾。`},{id:`9-haywire`,word:`haywire`,ipa:`/ˈheɪwaɪə/`,partOfSpeech:`adjective`,definition:`not working properly; out of control`,chinese:`失控的；乱七八糟的`,example:`My computer has gone haywire — it keeps crashing for no reason.`,exampleChinese:`我的电脑乱套了——它总是无缘无故地崩溃。`}],expressions:[{id:`9-fair-share`,phrase:`its fair share of`,explanation:`a reasonable or expected amount of something, often something unpleasant`,chinese:`相当多的；应得的一份`,example:`Moving house has its fair share of stress.`,exampleChinese:`搬家有相当多的压力。`},{id:`9-go-crazy`,phrase:`go crazy`,explanation:`to start behaving in a wild or out-of-control way`,chinese:`发疯；失控`,example:`The kids went crazy when they saw the ice cream truck.`,exampleChinese:`孩子们看到冰淇淋车就疯了。`},{id:`9-go-haywire`,phrase:`go haywire`,explanation:`to stop working correctly; to become chaotic`,chinese:`失控；乱套`,example:`All the traffic lights went haywire during the storm.`,exampleChinese:`暴风雨中所有的交通信号灯都失灵了。`},{id:`9-work-from-home`,phrase:`work from home`,explanation:`to do your job from your house instead of going to an office`,chinese:`在家办公；远程工作`,example:`Since the pandemic, many people have been working from home.`,exampleChinese:`疫情以来，很多人都在家办公。`}],speak:{question:`Describe a funny or embarrassing moment that happened at work or school.`,prompts:[`When and where it happened`,`What exactly happened`,`How other people reacted`,`And explain how you felt about it afterwards`],modelAnswer:`Oh, I've had so many embarrassing work moments it's hard to pick just one. But probably the funniest was during a video call with a really important client last year. I was working from home, and I was in the middle of presenting this really serious financial report. I was being all professional and formal, and then out of nowhere my cat jumped up onto the desk and walked right across my keyboard. She stepped on the spacebar about fifty times and accidentally opened about ten different windows. My screen just went completely haywire. I was trying to stay calm and keep talking while quietly trying to grab her, but she kept running back and forth. The clients on the other end just burst out laughing. One of them said it was the highlight of their day. I was so embarrassed in the moment — my face turned bright red and I started stammering. But after the initial panic, I couldn't help but laugh too. It actually ended up breaking the ice and the rest of the meeting was much more relaxed and friendly. I look back on it now and it's actually a really funny story. I did start closing the door of my home office for important calls after that, though. Lesson learned.`,modelAnswerChinese:`哦，我有过太多职场社死时刻了，都不好选哪个。但最好笑的可能是去年和一个特别重要的客户开视频会议的时候。我当时在家办公，正在做一份非常严肃的财务报告。我表现得特别专业、特别正式，然后我的猫不知从哪儿跳上了桌子，径直从键盘上走了过去。她踩了空格键大概五十次，还不小心打开了大约十个不同的窗口。我的电脑屏幕彻底乱套了。我一边努力保持镇定继续讲，一边悄悄想抓住她，但她跑来跑去的。另一端的客户们直接笑喷了。其中一个人说这是他们那天最精彩的时刻。我当时特别尴尬——脸涨得通红，都开始结巴了。但在最初的慌乱之后，我自己也忍不住笑了。这件事最后反而打破了僵局，之后的会议气氛都轻松友好了很多。现在回想起来，这真的是个很好笑的故事。不过从那以后，开重要会议我都会关上家庭办公室的门。教训啊。`},quiz:[{id:`9-q1`,type:`multiple-choice`,question:`"Perks" are:`,options:[`problems or difficulties`,`advantages or benefits`,`people who work in a park`,`types of coffee`],correctAnswer:`advantages or benefits`,explanation:`"Perks" = 好处；福利。Advantages or benefits, especially of a job.`},{id:`9-q2`,type:`fill-in-blank`,question:`"Work ______ home" means to do your job from your house instead of an office.`,correctAnswer:`from`,explanation:`"Work from home" = 在家办公；远程工作。Often abbreviated as WFH.`},{id:`9-q3`,type:`multiple-choice`,question:`If something "goes haywire", it:`,options:[`becomes very organised`,`stops working correctly`,`gets a new wire`,`works perfectly`],correctAnswer:`stops working correctly`,explanation:`"Go haywire" = 失控；乱套。To stop working properly; to become chaotic.`},{id:`9-q4`,type:`matching`,question:`"hilarious" means:`,options:[`very serious`,`extremely funny`,`very sad`,`extremely tired`],correctAnswer:`extremely funny`,explanation:`"Hilarious" = 极其滑稽的；非常好笑的。Extremely funny.`},{id:`9-q5`,type:`fill-in-blank`,question:`"______ through my presentation" means in the middle of giving my presentation.`,correctAnswer:`Midway`,explanation:`"Midway through" = 在……中途。In the middle of a process.`}]},{id:10,title:`Midnight Phone Addiction`,subtitle:`Glowing screen in the dark`,sceneKey:`phone`,accentColor:`#E17055`,story:[{english:`I tell myself every night that I will go to bed early and get a good night's sleep.`,chinese:`每天晚上我都告诉自己要早点上床，好好睡一觉。`},{english:`But as soon as I lie down, I reach for my phone "just to check one thing quickly."`,chinese:`但我一躺下，就伸手去拿手机"就快速看一眼"。`},{english:`Before I know it, I am mindlessly scrolling through social media, watching one short video after another.`,chinese:`不知不觉中，我就开始无意识地刷社交媒体，一个接一个地看短视频。`},{english:`The blue glow of the screen illuminates my face in the dark room, making me look like a zombie.`,chinese:`屏幕的蓝光在黑暗的房间里照亮我的脸，让我看起来像个僵尸。`},{english:`When I finally check the time, it is 2 AM — and I have to get up at 6:30.`,chinese:`等我终于看时间的时候，已经凌晨两点了——而我六点半就得起床。`}],vocabulary:[{id:`10-mindlessly`,word:`mindlessly`,ipa:`/ˈmaɪndləsli/`,partOfSpeech:`adverb`,definition:`without thinking or paying attention`,chinese:`无意识地；不用脑子地`,example:`I often find myself mindlessly eating snacks while watching TV.`,exampleChinese:`我经常发现自己看电视时无意识地吃零食。`},{id:`10-scroll`,word:`scroll`,ipa:`/skrəʊl/`,partOfSpeech:`verb`,definition:`to move text or images up, down, or across a screen`,chinese:`滚动；刷（手机）`,example:`I spent an hour scrolling through my phone before getting up.`,exampleChinese:`我起床前刷了一个小时手机。`},{id:`10-illuminate`,word:`illuminate`,ipa:`/ɪˈluːmɪneɪt/`,partOfSpeech:`verb`,definition:`to light something up`,chinese:`照亮；照明`,example:`The street lamps illuminate the road at night.`,exampleChinese:`路灯在夜晚照亮道路。`},{id:`10-zombie`,word:`zombie`,ipa:`/ˈzɒmbi/`,partOfSpeech:`noun`,definition:`a dead person who has been brought back to life; (informal) someone who looks very tired`,chinese:`僵尸；（非正式）憔悴的人`,example:`After pulling an all-nighter, I looked like a zombie the next day.`,exampleChinese:`熬了一整夜之后，第二天我看起来像个僵尸。`},{id:`10-reach-for`,word:`reach for`,ipa:`/riːtʃ fɔː/`,partOfSpeech:`phrasal verb`,definition:`to stretch out your hand to take or touch something`,chinese:`伸手去拿`,example:`He reached for his phone as soon as he woke up.`,exampleChinese:`他一醒来就伸手去拿手机。`},{id:`10-indulge`,word:`indulge`,ipa:`/ɪnˈdʌldʒ/`,partOfSpeech:`verb`,definition:`to let yourself do or have something that you enjoy, especially something that is considered bad for you`,chinese:`沉溺于；放纵`,example:`I sometimes indulge in a whole bar of chocolate when I am stressed.`,exampleChinese:`压力大的时候，我有时候会放纵自己吃完一整块巧克力。`}],expressions:[{id:`10-one-thing-after`,phrase:`one after another`,explanation:`in a sequence; one following the next`,chinese:`一个接一个地；接连地`,example:`The team won game after game, one after another.`,exampleChinese:`球队赢了一场又一场，接连获胜。`},{id:`10-good-nights-sleep`,phrase:`a good night's sleep`,explanation:`a long, restful night of sleep`,chinese:`一夜好觉`,example:`I need a good night's sleep before the exam tomorrow.`,exampleChinese:`明天考试前我需要睡个好觉。`},{id:`10-pull-all-nighter`,phrase:`pull an all-nighter`,explanation:`to stay up all night studying or working`,chinese:`熬夜通宵；开夜车`,example:`I had to pull an all-nighter to finish the essay on time.`,exampleChinese:`我不得不熬通宵才能按时写完论文。`},{id:`10-blue-glow`,phrase:`the blue glow of the screen`,explanation:`the blue light emitted by phones, computers, and other devices`,chinese:`屏幕的蓝光`,example:`Experts say the blue glow of screens can interfere with sleep.`,exampleChinese:`专家说屏幕的蓝光会影响睡眠。`}],speak:{question:`Describe a bad habit you have and how you would like to change it.`,prompts:[`What the bad habit is`,`How and when you developed it`,`What effects it has on your life`,`And explain what you could do to change it`],modelAnswer:`My worst habit by far is staying up too late scrolling on my phone. It's such a classic bad habit, but I just can't seem to break it. It started during university when I'd stay up late chatting with friends or watching videos, but it's gotten way worse in recent years. Every night, I tell myself I'll go to bed early and get a good night's sleep. But as soon as I lie down, I reach for my phone 'just to check one thing'. Before I know it, it's 2 o'clock in the morning and I've been mindlessly scrolling for hours. The blue glow of the screen just keeps me awake. The effects are pretty terrible. I'm always tired during the day, I struggle to concentrate at work, and I'm definitely not a pleasant person to be around before I've had my morning coffee. I know I should change, and I've tried — I've tried putting my phone in another room, I've tried setting screen time limits, I've even tried meditation apps. But I always end up going back to the same routine. I think the real solution is just more self-discipline. Maybe I should start small — instead of completely stopping, I could set a rule that I have to put my phone down by 11 PM. Baby steps, right? It's not going to change overnight, but I'd really like to kick this habit because I know how bad it is for my health.`,modelAnswerChinese:`我最严重的坏习惯绝对是熬夜刷手机。这是个特别典型的坏习惯，但我好像就是改不了。这个习惯是从大学开始的，那时候我熬夜和朋友聊天或者看视频，但最近几年变得严重多了。每天晚上，我都告诉自己要早点上床睡个好觉。但我一躺下，就伸手去拿手机"就看一眼"。不知不觉中，就已经凌晨两点了，我已经无意识地刷了好几个小时。屏幕的蓝光就是让我睡不着。影响挺糟糕的。我白天总是很累，工作时很难集中注意力，而且在喝到早上的咖啡之前，我绝对不是一个好相处的人。我知道我应该改变，也试过——我试过把手机放在另一个房间，试过设置屏幕使用时间限制，甚至试过冥想APP。但我最后总是又回到原来的习惯。我觉得真正的解决办法就是更强的自律。也许我应该从小处着手——不是完全戒掉，而是定一个规矩，晚上11点前必须放下手机。慢慢来，对吧？这不可能一夜之间就改变，但我真的很想改掉这个习惯，因为我知道这对健康有多不好。`},quiz:[{id:`10-q1`,type:`multiple-choice`,question:`"Scroll" through a phone means:`,options:[`to throw the phone`,`to move content up/down on the screen`,`to ma
