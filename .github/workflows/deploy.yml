name: Deploy PiCas

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download standalone PiCas app
        run: |
          if [ ! -f index.html ]; then
            curl -fsSL -o index.html https://dpaste.org/teSzc/raw
          fi
          wc -c index.html

      - name: Enable GitHub Pages via API
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          http_code=$(curl -sS -o /tmp/pages_resp -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/hzs-max/picas/pages \
            -d '{"source":{"branch":"main","path":"/"}}')
          echo "Pages API response code: $http_code"
          cp /tmp/pages_resp pages-response.txt
          echo "" >> pages-response.txt
          echo "HTTP_CODE=$http_code" >> pages-response.txt
          if [ "$http_code" != "201" ] && [ "$http_code" != "200" ] && [ "$http_code" != "409" ]; then
            echo "Pages enable failed; saving diagnostic to repo"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pages-response.txt
            git commit -m "Add Pages API diagnostic response"
            git push
            exit 1
          fi

      - name: Commit files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html pages-response.txt
          git commit -m "Update PiCas and Pages response record" || echo "No changes to commit"
          git push
