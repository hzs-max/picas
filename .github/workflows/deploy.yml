name: Deploy PiCas

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download standalone PiCas app
        run: |
          curl -fsSL -o index.html https://dpaste.org/teSzc/raw
          echo 'Downloaded bytes:'
          wc -c index.html
          head -c 15 index.html

      - name: Enable GitHub Pages via API
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          http_code=$(curl -sS -o /tmp/pages_resp -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/hzs-max/picas/pages \
            -d '{"source":{"branch":"main","path":"/"}}')
          echo "Pages API response code: $http_code"
          cat /tmp/pages_resp || true
          if [ "$http_code" = "201" ] || [ "$http_code" = "200" ] || [ "$http_code" = "409" ]; then
            echo 'Pages enabled or already enabled'
          else
            echo 'Unexpected response, continuing anyway'
          fi

      - name: Commit index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add PiCas standalone index.html" || echo "No changes to commit"
          git push
